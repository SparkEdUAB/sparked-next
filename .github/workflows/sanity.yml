name: Check code sanity

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  checks:
    name: Format, lint, type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Run linting
        run: bun run lint

      - name: Type check
        run: bun run type-check

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway MongoDB so the smoke test doesn't depend on an external cluster.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: sparked-next-ci
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Start production server
        run: |
          PORT=3000 bun run start > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/auth/login && exit 0
            kill -0 "$pid" 2>/dev/null || { echo "Server exited during startup"; exit 1; }
            sleep 2
          done
          echo "Server did not become ready"; exit 1

      - name: Smoke test routes
        run: |
          fail=0
          for path in / /auth/login /api/auth/providers /api/auth/csrf /api/grades/fetchGrades; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit "$fail"

      - name: Server log
        if: always()
        run: cat server.log || true
