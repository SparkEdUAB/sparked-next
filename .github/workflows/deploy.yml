# Deploy workflow for Sparked Next Application
# This workflow automatically deploys the application to production when changes are pushed to main branch
#
# Workflow steps:
# 1. Checks out the code
# 2. Sets up Node.js environment
# 3. Installs dependencies
# 4. Builds the application
# 5. Deploys to production server using PM2 when we create a release

name: Deploy App

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'

      - name: Deploy with PM2
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no root@95.111.229.11 << 'EOF'
            set -e
            cd /var/www/sparked-next
            git pull origin main
            node -v | grep -q '^v22\.' || { echo "Node 22 required"; exit 1; }
            command -v bun >/dev/null 2>&1 || npm install -g bun@1.4.5
            bun ci
            bun run build
            pm2 delete sparked-next >/dev/null 2>&1 || true
            pm2 start node_modules/next/dist/bin/next --name sparked-next --interpreter node -- start
            pm2 save

            echo "Deployment completed successfully!"
          EOF
